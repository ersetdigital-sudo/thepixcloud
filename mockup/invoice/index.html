<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cek Invoice · thepixcloud</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/app.js"></script>
</head>
<body>
<header id="hdr"></header>
<main class="wrap" style="padding-top:36px;max-width:820px">
  <span class="badge">Cek invoice</span>
  <h1 style="font-size:clamp(34px,6vw,56px);font-weight:900;line-height:1;margin-top:12px">Lacak pesanan kamu.</h1>
  <p class="mute" style="margin-top:10px">Masukkan kode invoice berformat TPC-XXXX.</p>
  <form id="f" class="flex gap-2" style="margin-top:20px">
    <input id="q" class="inp" placeholder="TPC-AB12" style="text-transform:uppercase;background:#fff">
    <button class="btn btn-red" style="min-height:52px;flex:none" aria-label="Cari"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="hidden sm:inline">Cari</span></button>
  </form>
  <div id="res" style="margin-top:24px"></div>
  <h2 style="font-size:24px;font-weight:800;margin-top:44px">Riwayat terakhir</h2>
  <p class="mute" style="font-size:13.5px">5 transaksi terakhir di perangkat ini.</p>
  <div id="hist" class="space-y-2.5" style="margin-top:14px"></div>
  <p class="mute" style="font-size:12.5px;margin-top:24px;padding:12px 14px;border:1px dashed rgba(25,31,6,.25);border-radius:12px">Catatan: ini masih simulasi. Tidak ada pembayaran sungguhan, data hanya tersimpan di browser kamu (localStorage).</p>
</main>
<div id="ftr"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const {orders,rp,qs,icon}=CZ;const $=id=>document.getElementById(id);
  const fmt=d=>new Date(d).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const show=id=>{const o=orders().find(x=>x.id===id.toUpperCase());
    if(!o){$('res').innerHTML=`<div class="card" style="padding:22px;text-align:center"><b>Invoice ${id||''} nggak ketemu.</b><p class="mute" style="font-size:14px;margin-top:4px">Cek lagi kodenya, atau hubungi bantuan.</p></div>`;return;}
    const r=(a,b)=>`<div class="flex justify-between gap-4" style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="mute">${a}</span><b style="text-align:right;word-break:break-all">${b}</b></div>`;
    $('res').innerHTML=`<div class="card card-pop" style="overflow:hidden">
      <div style="background:#E43E00;color:#F0EEDA;padding:22px" class="flex justify-between items-start gap-3">
        <div><div style="font-size:12px;opacity:.75;font-weight:700;letter-spacing:.06em">INVOICE</div><div class="fh" style="font-size:30px;font-weight:900">${o.id}</div><div style="font-size:13px;opacity:.8">${fmt(o.date)}</div></div>
        <span style="background:#F0EEDA;color:#E43E00;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;display:inline-flex;gap:6px;align-items:center">${icon('check','ic" style="width:16px;height:16px')}${o.status}</span></div>
      <div style="padding:8px 22px 22px;font-size:14.5px">${r('Produk',o.product)+r('Provider',o.provider)+r('Item',o.item)+r('Tujuan',o.target)+r('Metode',o.method)+r('Harga',rp(o.price))+r('Biaya',o.fee?rp(o.fee):'Gratis')+(o.disc?r('Diskon','−'+rp(o.disc)):'')}
        <div class="flex justify-between items-end" style="padding-top:14px"><span class="mute" style="font-weight:600">Total</span><span class="price" style="font-size:28px">${rp(o.total)}</span></div></div></div>`;};
  const hist=()=>{const a=orders().slice(0,5);
    $('hist').innerHTML=a.length?a.map(o=>`<button data-id="${o.id}" class="card w-full flex items-center gap-3" style="padding:14px 16px;text-align:left"><span style="width:40px;height:40px;border-radius:12px;background:#FFFCB0;color:#E43E00;display:grid;place-items:center;flex:none">${icon('receipt')}</span><span style="flex:1;min-width:0"><b>${o.item}</b><span class="mute" style="display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${o.id} · ${o.product} · ${fmt(o.date)}</span></span><span class="price">${rp(o.total)}</span></button>`).join('')
      :`<div class="mute card" style="padding:20px;text-align:center;font-size:14px">Belum ada transaksi. <a class="red" style="font-weight:700" href="/produk?s=pulsa">Mulai top up</a></div>`;
    $('hist').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.id;show(b.dataset.id);window.scrollTo({top:0,behavior:'smooth'});});};
  $('f').onsubmit=e=>{e.preventDefault();const v=$('q').value.trim();if(v){history.replaceState(null,'','?id='+v.toUpperCase());show(v);}};
  const id=qs('id');if(id){$('q').value=id;show(id);}
  hist();
});
</script>
</body>
</html>
